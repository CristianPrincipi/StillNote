<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; box-sizing: border-box; background-color: #F3EEE4; background-image: radial-gradient(circle, #D8CEBD 1px, transparent 1.4px); background-size: 22px 22px; background-position: 11px 11px; color: #2A2621; font-family: 'DM Mono', ui-monospace, 'Courier New', monospace">

  <header style="flex: none; display: flex; align-items: flex-start; justify-content: space-between; padding: 30px 24px 4px 24px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <p style="margin: 0; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #4F463D">Monday · 12 October</p>
      <h1 style="margin: 0; font-family: 'Kalam', 'Segoe Print', cursive; font-weight: 700; font-size: 46px; line-height: 1.15; letter-spacing: -0.01em">
        <span style="padding: 0 6px; margin-left: -6px; background: linear-gradient(180deg, transparent 58%, #F7E08C 58%, #F7E08C 90%, transparent 90%)">Today</span>
      </h1>
      <p style="margin: 0; font-size: 12px; color: #4F463D">{{summary}}</p>
    </div>
    <a href="Settings.dc.html" aria-label="Settings" style="width: 44px; height: 44px; margin: -4px -10px 0 0; display: flex; align-items: center; justify-content: center; color: #2A2621">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
    </a>
  </header>

  <main style="flex: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 20px 20px 132px 20px; display: flex; flex-direction: column; gap: 30px">

    <sc-if value="{{allClear}}" hint-placeholder-val="{{ false }}">
      <div style="padding: 72px 12px 0 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
        <p style="margin: 0; font-family: 'Kalam', 'Segoe Print', cursive; font-size: 30px; line-height: 1.2">All clear for today.</p>
        <p style="margin: 0; font-size: 12px; color: #4F463D">Nothing left on the desk.</p>
      </div>
    </sc-if>

    <ul aria-label="To do" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px">
      <sc-for list="{{open}}" as="t" hint-placeholder-count="4">
        <li style="display: flex; align-items: center; gap: 4px; min-height: 70px; box-sizing: border-box; padding: 10px 4px 10px 6px; background: {{t.bg}}; border-radius: 2px 2px 3px 18px / 2px 2px 3px 7px; box-shadow: 0 1px 1px rgba(42, 38, 33, 0.07), 0 12px 14px -12px rgba(42, 38, 33, 0.55); transform: rotate({{t.rot}})">
          <button type="button" onClick="{{t.toggle}}" aria-label="Mark {{t.title}} as done" style="flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; background: transparent; cursor: pointer">
            <span style="display: block; width: 22px; height: 22px; box-sizing: border-box; border: 1.6px solid #2A2621; border-radius: 54% 46% 52% 48% / 47% 55% 45% 53%"></span>
          </button>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
            <span style="font-family: 'Kalam', 'Segoe Print', cursive; font-size: 21px; line-height: 1.2; color: #2A2621">{{t.title}}</span>
            <span style="font-size: 11.5px; letter-spacing: 0.03em; color: #4F463D">{{t.meta}}</span>
          </div>
          <button type="button" onClick="{{t.remove}}" aria-label="Delete {{t.title}}" style="flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; background: transparent; color: #4F463D; cursor: pointer">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M6 7l1 12.2A2 2 0 0 0 9 21h6a2 2 0 0 0 2-1.8L18 7"></path><path d="M9 7V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V7"></path></svg>
          </button>
        </li>
      </sc-for>
    </ul>

    <sc-if value="{{hasDone}}" hint-placeholder-val="{{ true }}">
      <section aria-label="Done" style="display: flex; flex-direction: column; gap: 2px">
        <h2 style="margin: 0 0 2px 10px; font-size: 11px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: #4F463D">Done · {{doneCount}}</h2>
        <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
          <sc-for list="{{done}}" as="t" hint-placeholder-count="2">
            <li style="display: flex; align-items: center; gap: 4px; min-height: 52px; padding: 0 4px 0 6px; border-bottom: 1px dashed #CDC2AF">
              <button type="button" onClick="{{t.toggle}}" aria-label="Mark {{t.title}} as not done" style="flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; background: transparent; cursor: pointer">
                <span style="width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; background: #2A2621; color: #F3EEE4; border-radius: 54% 46% 52% 48% / 47% 55% 45% 53%">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
                </span>
              </button>
              <span style="flex: 1; min-width: 0; font-family: 'Kalam', 'Segoe Print', cursive; font-size: 19px; line-height: 1.2; color: #6A6056; text-decoration: line-through; text-decoration-thickness: 1.5px">{{t.title}}</span>
              <button type="button" onClick="{{t.remove}}" aria-label="Delete {{t.title}}" style="flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; background: transparent; color: #4F463D; cursor: pointer">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M6 7l1 12.2A2 2 0 0 0 9 21h6a2 2 0 0 0 2-1.8L18 7"></path><path d="M9 7V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V7"></path></svg>
              </button>
            </li>
          </sc-for>
        </ul>
      </section>
    </sc-if>
  </main>

  <a href="AddTask.dc.html" aria-label="Add a task" style="position: absolute; z-index: 3; right: 26px; bottom: 104px; width: 60px; height: 60px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #F7E08C; color: #2A2621; border: 1.6px solid #2A2621; border-radius: 3px 3px 3px 13px / 3px 3px 3px 6px; transform: rotate(-4deg); box-shadow: 4px 4px 0 -1.6px #F7E08C, 4px 4px 0 0 #2A2621, 0 18px 20px -12px rgba(42, 38, 33, 0.55)">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
  </a>

  <nav aria-label="Main" style="flex: none; position: relative; z-index: 2; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 6px 16px 16px 16px; background: #F3EEE4; border-top: 1px solid #D9CFBD">
    <a href="Calendar.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-height: 58px; text-decoration: none; color: #4F463D; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="1.5"></rect><path d="M3.5 10h17"></path><path d="M8 3v4"></path><path d="M16 3v4"></path></svg>
      <span style="display: inline-block; padding: 1px 7px">Calendar</span>
    </a>
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-height: 58px; text-decoration: none; color: #2A2621; font-size: 10.5px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14v10.5L13.5 20H5z"></path><path d="M13.5 20v-5.5H19"></path></svg>
      <span style="display: inline-block; padding: 1px 7px; background: #F7E08C; transform: rotate(-2deg)">Tasks</span>
    </a>
    <a href="Projects.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-height: 58px; text-decoration: none; color: #4F463D; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="8.5" width="13" height="12" rx="1"></rect><path d="M7.5 8.5V4.5h13v11.5h-4"></path></svg>
      <span style="display: inline-block; padding: 1px 7px">Projects</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tilt":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      tasks: [
        { id: 1, title: 'Reply to Marco about Friday', time: '10:30', project: 'Work', pr: 'high', done: false },
        { id: 2, title: 'Weekly review in Notion', time: '13:00', project: 'Personal', pr: 'med', done: false },
        { id: 3, title: 'Pick up the parcel', time: '18:00', project: 'Errands', pr: 'low', done: false },
        { id: 4, title: 'Read 20 pages', time: '', project: 'Reading', pr: 'none', done: false },
        { id: 5, title: 'Water the plants', time: '08:00', project: 'Personal', pr: 'low', done: true },
        { id: 6, title: 'Back up the laptop', time: '', project: 'Personal', pr: 'none', done: true }
      ]
    };
  }
  toggle(id) {
    this.setState({ tasks: this.state.tasks.map((t) => (t.id === id ? Object.assign({}, t, { done: !t.done }) : t)) });
  }
  remove(id) {
    this.setState({ tasks: this.state.tasks.filter((t) => t.id !== id) });
  }
  renderVals() {
    const COLORS = { high: '#F4B795', med: '#F7E08C', low: '#CFE1EA', none: '#FCFAF5' };
    const MARKS = { high: '!!!', med: '!!', low: '!', none: '' };
    const TILT = ['-0.7deg', '0.5deg', '-0.3deg', '0.8deg', '-0.5deg'];
    const tilt = this.props.tilt ?? true;
    const tasks = (this.state && this.state.tasks) || [];
    const shape = (t, i) => Object.assign({}, t, {
      meta: [t.time, t.project, MARKS[t.pr]].filter(Boolean).join(' · '),
      bg: COLORS[t.pr],
      rot: tilt ? TILT[i % TILT.length] : '0deg',
      toggle: () => this.toggle(t.id),
      remove: () => this.remove(t.id)
    });
    const open = tasks.filter((t) => !t.done).map(shape);
    const done = tasks.filter((t) => t.done).map(shape);
    return {
      open,
      done,
      hasDone: done.length > 0,
      allClear: open.length === 0,
      doneCount: done.length,
      summary: open.length + ' to do · ' + done.length + ' done'
    };
  }
}
</script>
</body>
</html>
