<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New task in a project</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3EEE4; color: #2A2621; font-family: 'DM Mono', ui-monospace, 'Courier New', monospace">

  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; filter: blur(1.5px)">
    <dc-import name="Projects" hint-size="390px,844px"></dc-import>
  </div>

  <a href="Projects.dc.html" aria-label="Close without saving" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; display: block; background: rgba(42, 38, 33, 0.42)"></a>

  <div role="dialog" aria-label="New task" style="position: absolute; left: 24px; top: 150px; width: 342px; box-sizing: border-box; padding: 28px 18px 14px 22px; display: flex; flex-direction: column; gap: 8px; background: #F7E08C; border-radius: 2px 2px 3px 26px / 2px 2px 3px 9px; transform: rotate(-1.2deg); box-shadow: 0 2px 2px rgba(42, 38, 33, 0.10), 0 34px 40px -26px rgba(20, 16, 12, 0.75)">
    <span aria-hidden="true" style="position: absolute; top: -14px; left: 114px; width: 112px; height: 28px; background: rgba(252, 250, 245, 0.58); border-left: 1px dashed rgba(42, 38, 33, 0.14); border-right: 1px dashed rgba(42, 38, 33, 0.14); transform: rotate(-3deg)"></span>

    <label for="task-name-project" style="font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #4F463D">New task</label>
    <textarea id="task-name-project" rows="2" placeholder="What needs doing?" value="{{text}}" onChange="{{onText}}" style="width: 100%; box-sizing: border-box; margin: 0; padding: 0; border: 0; outline: none; resize: none; background: transparent; font-family: 'Kalam', 'Segoe Print', cursive; font-size: 27px; line-height: 1.3; color: #2A2621"></textarea>

    <div style="display: flex; flex-wrap: wrap; gap: 6px">
      <span style="display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 8px; border: 1.2px solid #2A2621; border-radius: 999px; background: rgba(252, 250, 245, 0.45); font-size: 12px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="8.5" width="13" height="12" rx="1"></rect><path d="M7.5 8.5V4.5h13v11.5h-4"></path></svg>
        {{chip}}
      </span>
    </div>

    <sc-if value="{{pickerOpen}}" hint-placeholder-val="{{ true }}">
      <div style="margin: 6px -18px 0 -22px; border-top: 1.5px dashed rgba(42, 38, 33, 0.38)"></div>
      <section aria-label="Project" style="display: flex; flex-direction: column; gap: 10px; padding-top: 4px">
        <h2 style="margin: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: #4F463D">Project</h2>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{projects}}" as="p" hint-placeholder-count="5">
            <button type="button" onClick="{{p.pick}}" aria-pressed="{{p.selected}}" style="min-height: 44px; padding: 0 16px; border: 1.4px solid #2A2621; border-radius: 999px; background: {{p.bg}}; color: {{p.color}}; font-family: 'Kalam', 'Segoe Print', cursive; font-size: 18px; line-height: 1; cursor: pointer">{{p.name}}</button>
          </sc-for>
        </div>
      </section>
    </sc-if>

    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px">
      <div style="display: flex; align-items: center; gap: 2px; margin-left: -10px">
        <a href="AddTaskWhen.dc.html" aria-label="Set date and time" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #2A2621; border-radius: 10px">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.6"></circle><path d="M12 7.2V12l3.2 2"></path></svg>
        </a>
        <a href="AddTaskPriority.dc.html" aria-label="Set priority" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #2A2621; border-radius: 10px">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 21V3.8"></path><path d="M5.5 4h12l-2.6 4.4 2.6 4.4h-12"></path></svg>
        </a>
        <button type="button" onClick="{{togglePicker}}" aria-label="{{pickerLabel}}" aria-expanded="{{pickerOpen}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; color: #2A2621; border-radius: 10px; background: {{pickerBg}}; cursor: pointer">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="8.5" width="13" height="12" rx="1"></rect><path d="M7.5 8.5V4.5h13v11.5h-4"></path></svg>
        </button>
      </div>
      <a href="Projects.dc.html" aria-label="Save task" style="width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #2A2621; color: #F7E08C">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
      </a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { text: 'Send the slides to Marco', project: 'work', open: true };
  }
  renderVals() {
    const LIST = [
      { id: 'work', name: 'Work' },
      { id: 'personal', name: 'Personal' },
      { id: 'errands', name: 'Errands' },
      { id: 'reading', name: 'Reading' },
      { id: 'none', name: 'No project' }
    ];
    const s = this.state || { text: '', project: 'work', open: true };
    const cur = LIST.find((p) => p.id === s.project) || LIST[0];
    return {
      text: s.text,
      onText: (e) => this.setState({ text: e.target.value }),
      chip: cur.name,
      pickerOpen: !!s.open,
      pickerBg: s.open ? 'rgba(42, 38, 33, 0.12)' : 'transparent',
      pickerLabel: s.open ? 'Hide project' : 'Set project',
      togglePicker: () => this.setState({ open: !s.open }),
      projects: LIST.map((p) => ({
        name: p.name,
        selected: p.id === s.project,
        bg: p.id === s.project ? '#2A2621' : 'rgba(252, 250, 245, 0.45)',
        color: p.id === s.project ? '#F7E08C' : '#2A2621',
        pick: () => this.setState({ project: p.id })
      }))
    };
  }
}
</script>
</body>
</html>
