<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose a look</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=DM+Mono:wght@400;500&family=Kalam:wght@300;400;700&family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; box-sizing: border-box; background-color: #F3EEE4; background-image: radial-gradient(circle, #D8CEBD 1px, transparent 1.4px); background-size: 22px 22px; background-position: 11px 11px; color: #2A2621; font-family: 'DM Mono', ui-monospace, 'Courier New', monospace">

  <header style="flex: none; display: flex; flex-direction: column; gap: 8px; padding: 30px 24px 0 24px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #4F463D">Last step</span>
    </div>
    <h1 style="margin: 0; font-family: 'Kalam', 'Segoe Print', cursive; font-weight: 700; font-size: 40px; line-height: 1.15">Choose a look</h1>
    <p style="margin: 0; font-size: 12.5px; line-height: 1.6; color: #4F463D">You can change this any time in Settings.</p>
  </header>

  <main style="flex: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 18px 24px 16px 24px; display: flex; flex-direction: column; gap: 22px">

    <div aria-label="Preview" role="img" style="flex: none; position: relative; height: 168px; overflow: hidden; border-radius: 4px; border: 1.2px solid rgba(42, 38, 33, 0.22); background-color: {{ground}}; background-image: radial-gradient(circle, {{dot}} 1px, transparent 1.4px); background-size: 22px 22px; background-position: 11px 11px; transition: background-color 260ms ease">
      <div style="position: absolute; left: 52px; right: 20px; top: 92px; min-height: 58px; box-sizing: border-box; padding: 9px 14px; display: flex; flex-direction: column; justify-content: center; gap: 2px; background: {{noteB}}; border-radius: 2px 2px 3px 16px / 2px 2px 3px 6px; transform: rotate(1.6deg); box-shadow: 0 1px 1px rgba(0, 0, 0, 0.08), 0 12px 14px -12px rgba(0, 0, 0, 0.6)">
        <span style="font-family: {{family}}; font-size: 19px; line-height: 1.2; color: #2A2621">Call grandma</span>
        <span style="font-size: 11px; color: #4F463D">19:00 · Personal · !!</span>
      </div>
      <div style="position: absolute; left: 20px; right: 46px; top: 18px; min-height: 62px; box-sizing: border-box; padding: 10px 14px; display: flex; align-items: center; gap: 12px; background: {{noteA}}; border-radius: 2px 2px 3px 18px / 2px 2px 3px 7px; transform: rotate(-1deg); box-shadow: 0 1px 1px rgba(0, 0, 0, 0.08), 0 12px 14px -12px rgba(0, 0, 0, 0.6)">
        <span style="flex: none; display: block; width: 20px; height: 20px; box-sizing: border-box; border: 1.6px solid #2A2621; border-radius: 54% 46% 52% 48% / 47% 55% 45% 53%"></span>
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-family: {{family}}; font-size: 20px; line-height: 1.2; color: #2A2621">Water the plants</span>
          <span style="font-size: 11px; color: #4F463D">08:00 · Personal · !</span>
        </span>
      </div>
    </div>

    <section aria-labelledby="pal-h" style="flex: none; display: flex; flex-direction: column; gap: 10px">
      <h2 id="pal-h" style="margin: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: #4F463D">Color palette</h2>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{palettes}}" as="p" hint-placeholder-count="4">
          <button type="button" onClick="{{p.pick}}" aria-pressed="{{p.selected}}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; border: 0; background: transparent; color: #2A2621; font: inherit; cursor: pointer">
            <span style="position: relative; display: block; width: 100%; height: 62px; box-sizing: border-box; background: {{p.ground}}; border: {{p.border}}; border-radius: 4px; overflow: hidden">
              <span style="position: absolute; left: 12px; top: 10px; width: 26px; height: 26px; background: {{p.a}}; transform: rotate(-6deg); box-shadow: 0 6px 6px -5px rgba(0, 0, 0, 0.45)"></span>
              <span style="position: absolute; left: 30px; top: 24px; width: 26px; height: 26px; background: {{p.b}}; transform: rotate(5deg); box-shadow: 0 6px 6px -5px rgba(0, 0, 0, 0.45)"></span>
            </span>
            <span style="font-family: 'Kalam', 'Segoe Print', cursive; font-size: 17px; line-height: 1.2; padding: 0 5px; background: {{p.labelBg}}">{{p.name}}</span>
          </button>
        </sc-for>
      </div>
    </section>

    <section aria-labelledby="type-h" style="flex: none; display: flex; flex-direction: column; gap: 4px">
      <h2 id="type-h" style="margin: 0 0 6px 0; font-size: 11px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: #4F463D">Typography</h2>
      <sc-for list="{{fonts}}" as="f" hint-placeholder-count="3">
        <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.selected}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 6px 14px; box-sizing: border-box; border: 0; border-radius: 2px; background: {{f.bg}}; box-shadow: {{f.shadow}}; text-align: left; color: #2A2621; font: inherit; cursor: pointer">
          <span style="display: flex; align-items: baseline; gap: 12px; min-width: 0">
            <span style="font-family: {{f.family}}; font-size: 22px; line-height: 1.2">{{f.label}}</span>
            <span style="font-size: 11px; letter-spacing: 0.06em; color: #4F463D">{{f.fontName}}</span>
          </span>
          <span style="flex: none; width: 22px; height: 22px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 1.6px solid #2A2621; border-radius: 54% 46% 52% 48% / 47% 55% 45% 53%">
            <sc-if value="{{f.selected}}" hint-placeholder-val="{{ false }}">
              <span style="display: block; width: 10px; height: 10px; background: #2A2621; border-radius: 50%"></span>
            </sc-if>
          </span>
        </button>
      </sc-for>
    </section>
  </main>

  <footer style="flex: none; display: flex; align-items: center; justify-content: space-between; padding: 12px 24px 30px 18px">
    <a href="SetupDatabase.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 8px 0 6px; color: #4F463D; text-decoration: none; font-size: 13px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>
      Back
    </a>
    <a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 24px 0 26px; border-radius: 999px; background: #2A2621; color: #F7E08C; text-decoration: none; font-size: 14px; font-weight: 500; letter-spacing: 0.08em">
      Start writing
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
    </a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { palette: 'canary', font: 'hand' };
  }
  renderVals() {
    const PALETTES = [
      { id: 'canary', name: 'Canary', ground: '#F3EEE4', dot: '#D8CEBD', a: '#F7E08C', b: '#F4B795' },
      { id: 'sage', name: 'Sage', ground: '#EEF0E6', dot: '#D2D7C6', a: '#CFE3C4', b: '#F1D9A0' },
      { id: 'blush', name: 'Blush', ground: '#F6EEEB', dot: '#E0D2CD', a: '#F4C8C1', b: '#E3D5EC' },
      { id: 'night', name: 'Night', ground: '#26231F', dot: '#3D3832', a: '#F7E08C', b: '#8FB3C9' }
    ];
    const FONTS = [
      { id: 'hand', label: 'Handwritten', fontName: 'Kalam', family: "'Kalam', 'Segoe Print', cursive" },
      { id: 'type', label: 'Typewriter', fontName: 'Courier Prime', family: "'Courier Prime', 'Courier New', monospace" },
      { id: 'book', label: 'Bookish', fontName: 'Newsreader', family: "'Newsreader', Georgia, serif" }
    ];
    const s = this.state || { palette: 'canary', font: 'hand' };
    const pal = PALETTES.find((p) => p.id === s.palette) || PALETTES[0];
    const font = FONTS.find((f) => f.id === s.font) || FONTS[0];
    return {
      ground: pal.ground,
      dot: pal.dot,
      noteA: pal.a,
      noteB: pal.b,
      family: font.family,
      palettes: PALETTES.map((p) => ({
        name: p.name,
        ground: p.ground,
        a: p.a,
        b: p.b,
        selected: p.id === s.palette,
        border: p.id === s.palette ? '2px solid #2A2621' : '1.2px solid rgba(42, 38, 33, 0.3)',
        labelBg: p.id === s.palette ? '#F7E08C' : 'transparent',
        pick: () => this.setState({ palette: p.id })
      })),
      fonts: FONTS.map((f) => ({
        label: f.label,
        fontName: f.fontName,
        family: f.family,
        selected: f.id === s.font,
        bg: f.id === s.font ? '#FCFAF5' : 'transparent',
        shadow: f.id === s.font ? '0 1px 1px rgba(42, 38, 33, 0.07), 0 12px 14px -12px rgba(42, 38, 33, 0.55)' : 'none',
        pick: () => this.setState({ font: f.id })
      }))
    };
  }
}
</script>
</body>
</html>
