<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick your tasks database</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; box-sizing: border-box; background-color: #F3EEE4; background-image: radial-gradient(circle, #D8CEBD 1px, transparent 1.4px); background-size: 22px 22px; background-position: 11px 11px; color: #2A2621; font-family: 'DM Mono', ui-monospace, 'Courier New', monospace">

  <header style="flex: none; display: flex; flex-direction: column; gap: 8px; padding: 30px 24px 0 24px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span aria-hidden="true" style="display: flex; gap: 5px">
        <span style="display: block; width: 9px; height: 9px; box-sizing: border-box; border: 1.2px solid #2A2621; background: #2A2621"></span>
        <span style="display: block; width: 9px; height: 9px; box-sizing: border-box; border: 1.2px solid #2A2621; background: #2A2621"></span>
        <span style="display: block; width: 9px; height: 9px; box-sizing: border-box; border: 1.2px solid #2A2621"></span>
      </span>
      <span style="font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #4F463D">Step 2 of 3</span>
    </div>
    <h1 style="margin: 0; font-family: 'Kalam', 'Segoe Print', cursive; font-weight: 700; font-size: 40px; line-height: 1.15">Pick your tasks</h1>
    <p style="margin: 0; font-size: 12.5px; line-height: 1.6; color: #4F463D">Databases your integration can see. Choose the one that holds your to-dos.</p>
  </header>

  <main style="flex: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 16px 24px 16px 24px; display: flex; flex-direction: column; gap: 14px">

    <div role="radiogroup" aria-label="Databases" style="flex: none; display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{dbs}}" as="d" hint-placeholder-count="5">
        <button type="button" role="radio" aria-checked="{{d.selected}}" onClick="{{d.pick}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 54px; padding: 6px 14px; box-sizing: border-box; border: 0; border-bottom: {{d.rule}}; border-radius: 2px; background: {{d.bg}}; box-shadow: {{d.shadow}}; transform: rotate({{d.rot}}); text-align: left; color: #2A2621; font: inherit; cursor: pointer">
          <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
            <span style="font-family: 'Kalam', 'Segoe Print', cursive; font-size: 20px; line-height: 1.2">{{d.name}}</span>
            <span style="font-size: 11px; letter-spacing: 0.04em; color: #4F463D">{{d.parent}}</span>
          </span>
          <span style="flex: none; width: 22px; height: 22px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 1.6px solid #2A2621; border-radius: 54% 46% 52% 48% / 47% 55% 45% 53%">
            <sc-if value="{{d.selected}}" hint-placeholder-val="{{ false }}">
              <span style="display: block; width: 10px; height: 10px; background: #2A2621; border-radius: 50%"></span>
            </sc-if>
          </span>
        </button>
      </sc-for>
    </div>

    <div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <span style="font-size: 11px; line-height: 1.5; color: #4F463D">Missing one? Connect it in Notion, then refresh.</span>
      <button type="button" style="flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 4px 0 8px; border: 0; background: transparent; color: #2A2621; font-family: 'DM Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.5-4.5L4 8"></path><path d="M4 4v4h4"></path><path d="M4 13a8 8 0 0 0 14.5 4.5L20 16"></path><path d="M20 20v-4h-4"></path></svg>
        Refresh
      </button>
    </div>

    <section aria-labelledby="fields-h" style="flex: none; display: flex; flex-direction: column; padding: 12px 6px 6px 14px; border: 1.2px dashed #8A7F72; border-radius: 2px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; padding-right: 8px; margin-bottom: 4px">
        <h2 id="fields-h" style="margin: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: #4F463D">{{fieldsTitle}}</h2>
        <span style="font-size: 11px; color: #4F463D">{{fieldsFound}}</span>
      </div>
      <sc-for list="{{fields}}" as="f" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px">
          <span style="font-size: 11.5px; letter-spacing: 0.04em; color: #4F463D">{{f.label}}</span>
          <button type="button" aria-label="{{f.aria}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 8px; border: 0; background: transparent; color: {{f.color}}; font: inherit; cursor: pointer">
            <span style="font-family: {{f.family}}; font-size: {{f.size}}; line-height: 1.2">{{f.value}}</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
          </button>
        </div>
      </sc-for>
    </section>
  </main>

  <footer style="flex: none; display: flex; align-items: center; justify-content: space-between; padding: 12px 24px 30px 18px">
    <a href="SetupToken.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 8px 0 6px; color: #4F463D; text-decoration: none; font-size: 13px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>
      Back
    </a>
    <a href="SetupStyle.dc.html" style="display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 24px 0 26px; border-radius: 999px; background: #2A2621; color: #F7E08C; text-decoration: none; font-size: 14px; font-weight: 500; letter-spacing: 0.08em">
      Next
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
    </a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'tasks' };
  }
  renderVals() {
    const DBS = [
      { id: 'tasks', name: 'Tasks', parent: 'in Home', map: ['Name', 'Done', 'Due', 'Priority', 'Project'] },
      { id: 'projects', name: 'Projects', parent: 'in Home', map: ['Name', null, null, null, null] },
      { id: 'reading', name: 'Reading list', parent: 'in Books', map: ['Title', 'Read', 'Finished', null, null] },
      { id: 'habits', name: 'Habits', parent: 'in Home', map: ['Habit', 'Done today', 'Date', null, null] },
      { id: 'meetings', name: 'Meeting notes', parent: 'in Work', map: ['Name', null, 'Date', null, 'Project'] }
    ];
    const LABELS = ['Task name', 'Done', 'Date', 'Priority', 'Project'];
    const s = this.state || { sel: 'tasks' };
    const cur = DBS.find((d) => d.id === s.sel) || DBS[0];
    const found = cur.map.filter(Boolean).length;
    return {
      dbs: DBS.map((d) => {
        const on = d.id === s.sel;
        return {
          name: d.name,
          parent: d.parent,
          selected: on,
          bg: on ? '#FCFAF5' : 'transparent',
          shadow: on ? '0 1px 1px rgba(42, 38, 33, 0.07), 0 12px 14px -12px rgba(42, 38, 33, 0.55)' : 'none',
          rot: on ? '-0.5deg' : '0deg',
          rule: on ? '1px solid transparent' : '1px dashed #CDC2AF',
          pick: () => this.setState({ sel: d.id })
        };
      }),
      fieldsTitle: 'Fields in “' + cur.name + '”',
      fieldsFound: found + ' of 5 found',
      fields: LABELS.map((label, i) => {
        const v = cur.map[i];
        return {
          label,
          value: v || 'Not found · choose',
          aria: label + ': ' + (v ? v + ', change' : 'not found, choose a property'),
          color: v ? '#2A2621' : '#A63D22',
          family: v ? "'Kalam', 'Segoe Print', cursive" : "'DM Mono', ui-monospace, monospace",
          size: v ? '17px' : '11.5px'
        };
      })
    };
  }
}
</script>
</body>
</html>
