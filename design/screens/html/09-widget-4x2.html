        <span style="font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #4F463D">Mon 12 Oct · 4 to do</span>
      </a>
      <a href="AddTask.dc.html" aria-label="Add a task" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #2A2621">

    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">

          <button type="button" aria-label="Mark Reply to Marco about Friday as done" style="flex: none; width: 30px; height: 31px; display: flex; align-items: center; justify-content: flex-start; padding: 0; border: 0; background: transparent; cursor: pointer">
            <span style="display: block; width: 17px; height: 17px; box-sizing: border-box; border: 1.6px solid #A63D22; border-radius: 54% 46% 52% 48% / 47% 55% 45% 53%"></span>
          </button>
          <span style="flex: 1; min-width: 0; font-family: 'Kalam', 'Segoe Print', cursive; font-size: 17px; line-height: 1.2; color: #A63D22; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Reply to Marco about Friday</span>

            <span style="display: block; width: 17px; height: 17px; box-sizing: border-box; border: 1.6px solid #2C5F80; border-radius: 54% 46% 52% 48% / 47% 55% 45% 53%"></span>

            <span style="display: block; width: 17px; height: 17px; box-sizing: border-box; border: 1.6px solid #2A2621; border-radius: 54% 46% 52% 48% / 47% 55% 45% 53%"></span>
